# Checks every card and runs the tests on pushes to main and on pull requests.
# The site itself is deployed by Vercel, which builds every push automatically.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cards
        run: node tools/validate-cards.mjs
      - name: Run tests
        run: node --test tests/*.test.mjs
